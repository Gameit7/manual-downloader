name: Content Analyzer

on:
  workflow_dispatch:
    inputs:
      anilist_id:
        description: 'Media ID'
        required: true
        type: string
      episodes:
        description: 'Content range (e.g. "1-12" or "5,8,10")'
        required: true
        type: string
      force:
        description: 'Force reprocess existing entries'
        required: false
        type: boolean
        default: false
      nyaa_url:
        description: 'Direct source URL(s) comma-separated (optional — e.g. url1,url2 or batch URL)'
        required: false
        type: string

concurrency:
  group: content-analyzer
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends aria2 ffmpeg

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run analysis
        env:
          ANILIST_ID: ${{ inputs.anilist_id }}
          EPISODES: ${{ inputs.episodes }}
          FORCE_REDOWNLOAD: ${{ inputs.force }}
          NYAA_URL: ${{ inputs.nyaa_url }}
          TURSO_URL: ${{ secrets.TURSO_URL }}
          TURSO_TOKEN: ${{ secrets.TURSO_TOKEN }}
          PIXELDRAIN_API_KEY: ${{ secrets.PIXELDRAIN_API_KEY }}
          GAS_PROXY_URL: ${{ secrets.GAS_PROXY_URL }}
          GAS_PROXY_URL_2: ${{ secrets.GAS_PROXY_URL_2 }}
          GAS_PROXY_URL_3: ${{ secrets.GAS_PROXY_URL_3 }}
          GAS_PROXY_URL_4: ${{ secrets.GAS_PROXY_URL_4 }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: python app.py
